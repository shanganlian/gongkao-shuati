# 必得题库 - nginx 站点配置（首次发布时由 02-release.sh 安装）
# 说明：
# 1. 这份模板只有 80 端口；04-certbot.sh 会自动追加 443/证书/HTTP->HTTPS 跳转。
# 2. proxy_pass 后面不要加斜杠，否则 /api/xxx 会被改写成 /xxx。
# 3. 发布脚本只做 nginx -t + reload，不会覆盖 certbot 改过的本文件。

server {
    listen 80;
    listen [::]:80;
    server_name igoiget.com www.igoiget.com;

    server_tokens off;
    client_max_body_size 12m;

    access_log /var/log/nginx/igoiget.access.log;
    error_log  /var/log/nginx/igoiget.error.log warn;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    root /var/www/bideti/current/dist;
    index index.html;

    # 后端 API（pm2 只监听 127.0.0.1:3002）
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 题库静态数据（体积较大，单独缓存）
    location /data/ {
        try_files $uri =404;
        expires 1h;
    }

    # Vite 产物带 hash，可长缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # SPA 入口不缓存，保证发版后立即生效
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 证书启用后可再加 HSTS（确认全站 HTTPS 无误后再取消注释）：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
