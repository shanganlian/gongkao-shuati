<!doctype html>
<html lang="zh-CN">
  <body style="margin:0;padding:0;background:#f1f5f9;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f1f5f9;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:14px;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;">
            <tr>
              <td style="background:#059669;padding:18px 24px;color:#ffffff;font-size:17px;font-weight:700;letter-spacing:.5px;">必得题库</td>
            </tr>
            <tr>
              <td style="padding:28px 24px 8px;color:#0f172a;font-size:15px;line-height:1.7;">
                你正在进行一次敏感操作（如修改密码、绑定信息），需要再确认一次身份。
              </td>
            </tr>
            <tr>
              <td style="padding:8px 24px 0;color:#334155;font-size:14px;line-height:1.7;">
                本次验证码：
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:18px 24px;">
                <div style="display:inline-block;padding:14px 22px;background:#ecfdf5;border:1px dashed #6ee7b7;border-radius:10px;color:#047857;font-size:30px;font-weight:700;letter-spacing:8px;font-family:Menlo,Consolas,monospace;">{{ .Token }}</div>
              </td>
            </tr>
            <tr>
              <td style="padding:0 24px;color:#475569;font-size:14px;line-height:1.7;">
                验证码 <strong>10 分钟内</strong>有效，仅限本次使用。
              </td>
            </tr>
            <tr>
              <td style="padding:20px 24px 28px;color:#94a3b8;font-size:12px;line-height:1.7;border-top:1px solid #e2e8f0;">
                如果这不是你本人的操作，请立即修改密码并联系我们。<br />
                本邮件由系统自动发送，请勿直接回复。
              </td>
            </tr>
          </table>
          <div style="max-width:520px;padding:14px 8px 0;color:#94a3b8;font-size:11px;line-height:1.6;font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;">
            必得题库 · 公务员与事业单位备考题库<br />
            <a href="{{ .SiteURL }}" style="color:#94a3b8;">{{ .SiteURL }}</a>
          </div>
        </td>
      </tr>
    </table>
  </body>
</html>
